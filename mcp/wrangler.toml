# Cloudflare Workers stub for remote guest MCP.
# Requires Cloudflare account credentials (not in repo).
#
#   cd mcp
#   npx wrangler login
#   npx wrangler deploy
#
# Optional:
#   npx wrangler secret put TISCHBUCH_SUPA_ANON_KEY
#   npx wrangler secret put TISCHBUCH_MCP_TOKEN
#
# Until secrets/account are available, prefer Docker / Node:
#   npm run start:http

name = "tischbuch-guest-mcp"
main = "src/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Public defaults match the SPA; override in dashboard if needed.
# TISCHBUCH_SUPA_URL = "https://cttvfdoxgvhzfrrnqkgn.supabase.co"

# Routes / custom domain: set in Cloudflare dashboard after first deploy.
