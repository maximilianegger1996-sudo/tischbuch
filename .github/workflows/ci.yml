name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spa:
    name: SPA syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check index.html + markers
        run: node scripts/check-spa.mjs

  mcp-smoke:
    name: MCP smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install MCP deps
        working-directory: mcp
        run: npm ci
      - name: Read-only guest smoke
        working-directory: mcp
        run: npm run smoke
